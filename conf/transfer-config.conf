# Hive Cross-Cluster Transfer Configuration
# This file configures data transfer from source to target Cloudera cluster

job {
  id = "transfer-job-001"
}

# Source Cluster Configuration (Region A)
# Data is read via JDBC connection to HiveServer2
source {
  hive {
    # HiveServer2 JDBC URL on source cluster
    # Format: jdbc:hive2://<host>:<port>/<database>
    jdbcUrl = "jdbc:hive2://source-hiveserver2.region-a.example.com:10000/default"
    database = "source_db"
  }

  kerberos {
    enabled = false
    # Uncomment for Kerberos-secured clusters:
    # enabled = true
    # principal = "hive/source-hiveserver2.region-a.example.com@REGION-A.EXAMPLE.COM"
    # keytab = "/etc/security/keytabs/hive.service.keytab"
  }
}

# Target Cluster Configuration (Region B)
# Spark runs on target cluster with native Hive integration
target {
  hive {
    # Target database where tables will be created
    database = "target_db"
    # Note: No JDBC URL needed - Spark uses native metastore connection
    jdbcUrl = ""  # Not used for target
  }

  kerberos {
    enabled = false
    # Uncomment for Kerberos-secured clusters:
    # enabled = true
    # principal = "spark/target-node.region-b.example.com@REGION-B.EXAMPLE.COM"
    # keytab = "/etc/security/keytabs/spark.keytab"
  }
}

# Tables to Transfer
# Each table entry specifies source, target, columns, and filter
tables = [
  {
    # Source table name (in source database)
    source = "customer_transactions"
    # Target table name (in target database)
    target = "customer_transactions"
    # Columns to transfer (use ["*"] for all columns)
    columns = ["customer_id", "transaction_id", "amount", "transaction_date", "region"]
    # Row filter (SQL WHERE condition)
    filter = "region = 'REGION_B' AND transaction_date >= '2024-01-01'"
    # Partition columns for target table (optional)
    partitionBy = ["transaction_date"]
    # Write mode: overwrite, append, ignore, error
    writeMode = "overwrite"
  },
  {
    source = "customer_profiles"
    target = "customer_profiles"
    columns = ["customer_id", "name", "email", "region", "created_date"]
    filter = "region = 'REGION_B'"
    partitionBy = []
    writeMode = "overwrite"
  },
  {
    source = "product_catalog"
    target = "product_catalog"
    # Transfer all columns
    columns = ["*"]
    # No filter - transfer all rows
    # filter = ""
    partitionBy = []
    writeMode = "overwrite"
  }
]

# Transfer Settings
transfer {
  # Batch size for JDBC reads
  batchSize = 10000
  # Number of parallel partitions for reading
  parallelism = 20
  # Enable audit logging
  enableAudit = true
}
